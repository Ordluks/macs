name:                macs
version:             0.1.0.0
github:              "Ordluks/macs"
license:             GPL-3-only
author:              "Ordluks"
copyright:           "2025 Yakov Basaranovich"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
synopsis:            Multimedia Aggregated Collection Service
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/Ordluks/macs#readme>

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  default-extensions:
  - DeriveGeneric
  source-dirs: src
  dependencies:
  - acid-state
  - bytestring
  - cereal >= 0.5.8.3
  - containers
  - safecopy
  - lens
  - network
  - uuid

tests:
  macs-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - macs
